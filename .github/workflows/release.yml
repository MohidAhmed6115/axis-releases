name: Publish Release to Public Repository

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag version (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

env:
  PUBLIC_RELEASE_REPO: ${{ vars.PUBLIC_RELEASE_REPO || 'MohidAhmed6115/axis-releases' }}
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

jobs:
  # ============================================================================
  # 1. BUILD ANDROID RELEASE (CAPACITOR APK)
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          # Build debug APK for immediate installation and testing
          ./gradlew assembleDebug --stacktrace
          # Also attempt assembleRelease if signing configuration exists
          ./gradlew assembleRelease || echo "Release build completed (unsigned)"

      - name: Prepare Android Artifact
        run: |
          mkdir -p dist-artifacts
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          
          # Find produced APK (prefer release, fallback to debug)
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" "dist-artifacts/axis-android-${TAG_NAME}.apk"
          else
            echo "::error::No APK generated in android/app/build/outputs/apk"
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axis-android-apk
          path: dist-artifacts/*.apk
          retention-days: 5

  # ============================================================================
  # 2. BUILD WINDOWS DESKTOP RELEASE (ELECTRON NSIS .EXE)
  # ============================================================================
  build-electron:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Package Windows Executable with electron-builder
        run: npx electron-builder --win nsis --publish never

      - name: Prepare Windows Desktop Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          $tagName = if ("${{ inputs.tag_name }}") { "${{ inputs.tag_name }}" } else { "${env:GITHUB_REF_NAME}" }
          $exeFile = Get-ChildItem -Path "dist-electron" -Filter "*.exe" | Select-Object -First 1
          if ($exeFile) {
            Write-Host "Found executable: $($exeFile.FullName)"
            Copy-Item -Path $exeFile.FullName -Destination "dist-artifacts/axis-windows-setup-$tagName.exe"
          } else {
            Write-Error "No Windows .exe executable found in dist-electron"
            exit 1
          }

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axis-electron-windows
          path: dist-artifacts/*.exe
          retention-days: 5

  # ============================================================================
  # 3. PUBLISH RELEASE
  # ============================================================================
  publish-release:
    name: Publish Release
    needs: [build-android, build-electron]
    if: always() && !cancelled() && (needs.build-android.result == 'success' || needs.build-electron.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Generate Dynamic Release Notes
        id: release_notes
        run: |
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          NOTES_FILE="RELEASE_NOTES.tmp.md"

          echo "Generating notes for tag: $TAG_NAME"

          # 1. First preference: Extract matching tag section from CHANGELOG.md if present
          if [ -f "CHANGELOG.md" ] && grep -q -i "\[$TAG_NAME\]" CHANGELOG.md; then
            echo "Found matching tag in CHANGELOG.md"
            awk -v tag="\[$TAG_NAME\]" '
              $0 ~ tag {flag=1; next}
              flag && /^## / {flag=0}
              flag {print}
            ' CHANGELOG.md > "$NOTES_FILE"
          fi

          # 2. Fallback: If CHANGELOG entry is empty or missing, extract commit log
          if [ ! -s "$NOTES_FILE" ]; then
            echo "CHANGELOG entry empty or missing, extracting recent commit history..."
            PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")

            {
              echo "### Axis $TAG_NAME Release"
              echo ""
              echo "📦 **Downloads available:**"
              echo "- **Android Mobile App**: \`axis-android-${TAG_NAME}.apk\`"
              echo "- **Windows Desktop Installer**: \`axis-windows-setup-${TAG_NAME}.exe\`"
              echo ""
              if [ -n "$PREV_TAG" ]; then
                echo "Changes since **$PREV_TAG**:"
                echo ""
                git log "${PREV_TAG}..${TAG_NAME}" --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges
              else
                echo "Changes in this build:"
                echo ""
                git log -n 25 --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges
              fi
              echo ""
              echo "---"
              echo "*Automated cross-platform build generated from source.*"
            } > "$NOTES_FILE"
          fi

          cat "$NOTES_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Release to Repository
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ env.PUBLIC_RELEASE_REPO }}
          CURRENT_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          FILES_TO_ATTACH=()
          for file in release-binaries/*; do
            if [ -f "$file" ]; then
              echo "Including binary artifact: $file"
              FILES_TO_ATTACH+=("$file")
            fi
          done

          if [ ${#FILES_TO_ATTACH[@]} -eq 0 ]; then
            echo "::error::No build artifacts found in release-binaries directory!"
            exit 1
          fi

          # Step A: Always create or update the release in the current repository using standard GITHUB_TOKEN
          echo "Publishing to current repository $CURRENT_REPO..."
          export GH_TOKEN="$GITHUB_TOKEN"
          gh release create "$TAG_NAME" "${FILES_TO_ATTACH[@]}" \
            --repo "$CURRENT_REPO" \
            --title "Axis $TAG_NAME" \
            --notes-file "RELEASE_NOTES.tmp.md" \
            --verify-tag=false || \
          gh release upload "$TAG_NAME" "${FILES_TO_ATTACH[@]}" \
            --repo "$CURRENT_REPO" \
            --clobber || echo "Warning: Release upload to $CURRENT_REPO completed with warnings"

          # Step B: If custom RELEASE_REPO_TOKEN exists and target repo differs, publish there too
          if [ -n "$RELEASE_REPO_TOKEN" ] && [ "$TARGET_REPO" != "$CURRENT_REPO" ]; then
            echo "Publishing to target repository $TARGET_REPO using RELEASE_REPO_TOKEN..."
            export GH_TOKEN="$RELEASE_REPO_TOKEN"
            gh release create "$TAG_NAME" "${FILES_TO_ATTACH[@]}" \
              --repo "$TARGET_REPO" \
              --title "Axis $TAG_NAME" \
              --notes-file "RELEASE_NOTES.tmp.md" \
              --verify-tag=false || \
            gh release upload "$TAG_NAME" "${FILES_TO_ATTACH[@]}" \
              --repo "$TARGET_REPO" \
              --clobber || echo "Warning: Upload to $TARGET_REPO completed with warnings"
          else
            echo "Target repository is current repo or RELEASE_REPO_TOKEN not provided; published to $CURRENT_REPO."
          fi
