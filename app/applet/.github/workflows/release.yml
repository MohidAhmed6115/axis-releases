name: Publish Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag to release (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

env:
  PUBLIC_RELEASE_REPO: ${{ vars.PUBLIC_RELEASE_REPO || 'MohidAhmed6115/axis-releases' }}
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ============================================================================
  # 1. BUILD ANDROID RELEASE (CAPACITOR APK)
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease || echo "Release build step completed"

      - name: Prepare Android Artifact
        run: |
          mkdir -p dist-artifacts
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" "dist-artifacts/axis-android-${TAG_NAME}.apk"
          else
            echo "::error::No APK generated in android/app/build/outputs/apk"
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axis-android-apk
          path: dist-artifacts/*.apk
          retention-days: 5

  # ============================================================================
  # 2. BUILD WINDOWS DESKTOP RELEASE (ELECTRON NSIS .EXE)
  # ============================================================================
  build-electron:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Package Windows Executable with electron-builder
        run: npx electron-builder --win nsis --publish never

      - name: Prepare Windows Desktop Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          $tagName = if ("${{ github.event.inputs.tag_name }}") { "${{ github.event.inputs.tag_name }}" } else { "${env:GITHUB_REF_NAME}" }
          $exeFile = Get-ChildItem -Path "dist-electron" -Filter "*.exe" | Select-Object -First 1
          if ($exeFile) {
            Write-Host "Found executable: $($exeFile.FullName)"
            Copy-Item -Path $exeFile.FullName -Destination "dist-artifacts/axis-windows-setup-$tagName.exe"
          } else {
            Write-Error "No Windows .exe executable found in dist-electron"
            exit 1
          }

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axis-electron-windows
          path: dist-artifacts/*.exe
          retention-days: 5

  # ============================================================================
  # 3. PUBLISH RELEASE
  # ============================================================================
  publish-release:
    name: Publish Release
    needs: [build-android, build-electron]
    if: always() && !cancelled() && (needs.build-android.result == 'success' || needs.build-electron.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Generate Dynamic Release Notes
        id: release_notes
        run: |
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          NOTES_FILE="RELEASE_NOTES.tmp.md"

          if [ -f "CHANGELOG.md" ] && grep -q -i "\[$TAG_NAME\]" CHANGELOG.md; then
            echo "Found matching tag in CHANGELOG.md"
            awk -v tag="\[$TAG_NAME\]" '
              $0 ~ tag {flag=1; next}
              flag && /^## / {flag=0}
              flag {print}
            ' CHANGELOG.md > "$NOTES_FILE"
          fi

          if [ ! -s "$NOTES_FILE" ]; then
            {
              echo "### Axis $TAG_NAME"
              echo ""
              echo "🚀 **Cross-platform build artifacts for Axis ($TAG_NAME):**"
              echo ""
              echo "📦 **Downloads:**"
              echo "- **Android Mobile App**: \`axis-android-${TAG_NAME}.apk\`"
              echo "- **Windows Desktop Installer**: \`axis-windows-setup-${TAG_NAME}.exe\`"
              echo ""
              echo "---"
              echo "*Automated cross-platform build generated by GitHub Actions.*"
            } > "$NOTES_FILE"
          fi

          cat "$NOTES_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Release to Main Repository (${{ github.repository }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          FILES_TO_ATTACH=()
          for file in release-binaries/*; do
            if [ -f "$file" ]; then
              echo "Including binary artifact: $file"
              FILES_TO_ATTACH+=("$file")
            fi
          done

          echo "Publishing to current repository: ${{ github.repository }} (tag: $TAG_NAME)"
          gh release create "$TAG_NAME" "${FILES_TO_ATTACH[@]}" \
            --title "Axis $TAG_NAME" \
            --notes-file "RELEASE_NOTES.tmp.md" \
            --verify-tag=false || \
          gh release upload "$TAG_NAME" "${FILES_TO_ATTACH[@]}" \
            --clobber

      - name: Mirror Release to Public Repository (${{ env.PUBLIC_RELEASE_REPO }})
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TARGET_REPO: ${{ env.PUBLIC_RELEASE_REPO }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_REPO_TOKEN secret not configured; skipping mirror to external repo $TARGET_REPO."
            exit 0
          fi

          FILES_TO_ATTACH=()
          for file in release-binaries/*; do
            if [ -f "$file" ]; then
              FILES_TO_ATTACH+=("$file")
            fi
          done

          echo "Mirroring release to external repository: $TARGET_REPO"
          gh release create "$TAG_NAME" "${FILES_TO_ATTACH[@]}" \
            --repo "$TARGET_REPO" \
            --title "Axis $TAG_NAME" \
            --notes-file "RELEASE_NOTES.tmp.md" \
            --verify-tag=false || \
          gh release upload "$TAG_NAME" "${FILES_TO_ATTACH[@]}" \
            --repo "$TARGET_REPO" \
            --clobber
